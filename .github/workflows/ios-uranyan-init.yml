name: iOS Init (うらにゃん)

# `ios-uranyan/` ディレクトリを CI で1回だけ生成し、新ブランチに PR を作る。
#
# ローカル Mac が無くても GitHub Actions の macos-15 ランナーで
# `npx cap add ios` を走らせ、生成物 (Xcode プロジェクト) を
# `ios-uranyan/` にリネームしてリポジトリに取り込む。
#
# 実行方法:
#   1. Actions タブから "iOS Init (うらにゃん)" を選び Run workflow
#   2. 完了後、自動生成された PR をマージ
#   3. その後は ios-build-uranyan.yml で TestFlight に上げられる
#
# 注意: 既に `ios-uranyan/` が存在する場合はスキップする (再生成しない)。
# 再生成したい場合は手動で削除してから再実行。

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ios-uranyan-init
  cancel-in-progress: false

jobs:
  init:
    name: Generate ios-uranyan/
    runs-on: macos-15
    timeout-minutes: 30

    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bail if ios-uranyan/ already exists
        run: |
          if [ -d ios-uranyan ]; then
            echo "::error::ios-uranyan/ already exists. Delete it from the repo first if you want to regenerate."
            exit 1
          fi

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Swap in うらにゃん用 Capacitor config
        # `npx cap add ios` は capacitor.config.ts を読むので、
        # 一時的にうらにゃん用設定を有効にする
        run: |
          mv capacitor.config.ts capacitor.config.ts.bak
          cp capacitor.uranyan.config.ts capacitor.config.ts

      - name: Prepare empty webDir
        # capacitor.config.ts の webDir (out/) は存在しないと cap add ios が落ちる
        run: mkdir -p out

      - name: Move Filmo's ios/ aside
        # `npx cap add ios` は既存の ios/ ディレクトリがあると拒否する:
        #   [error] ios platform already exists.
        # Filmo 本体の ios/ を一時退避して新規プロジェクトを生成できるようにする。
        run: |
          if [ -d ios ]; then
            mv ios ios.filmo.bak
          fi

      - name: npx cap add ios (新規 iOS プロジェクト生成)
        run: npx cap add ios

      - name: Rename ios/ -> ios-uranyan/ and restore Filmo's ios/
        run: |
          mv ios ios-uranyan
          if [ -d ios.filmo.bak ]; then
            mv ios.filmo.bak ios
          fi

      - name: Restore Filmo 本体の capacitor.config.ts
        run: |
          rm capacitor.config.ts
          mv capacitor.config.ts.bak capacitor.config.ts

      - name: Patch Info.plist (CFBundleDisplayName = うらにゃん)
        run: |
          plutil -replace CFBundleDisplayName -string "うらにゃん" ios-uranyan/App/App/Info.plist
          # 輸出コンプライアンス: 標準 HTTPS 以外の暗号化を使っていないので false。
          # これが無いと TestFlight で毎ビルド「Missing Compliance」になる。
          plutil -replace ITSAppUsesNonExemptEncryption -bool false ios-uranyan/App/App/Info.plist || \
            plutil -insert ITSAppUsesNonExemptEncryption -bool false ios-uranyan/App/App/Info.plist
          # @capacitor/camera を npm 依存に持つため、Apple のバイナリ解析が
          # Photos / AVFoundation API への参照を検出して purpose string を要求する
          # (ITMS-90683)。3 種とも宣言。実機能としてはシェア結果画像の保存にのみ
          # 写真ライブラリ書き込みを使う可能性がある。
          plutil -replace NSCameraUsageDescription -string "占いシェアカードを撮影・編集する際にカメラを使用する場合があります。" ios-uranyan/App/App/Info.plist || \
            plutil -insert NSCameraUsageDescription -string "占いシェアカードを撮影・編集する際にカメラを使用する場合があります。" ios-uranyan/App/App/Info.plist
          plutil -replace NSPhotoLibraryUsageDescription -string "占い結果のシェア時に写真ライブラリにアクセスする場合があります。" ios-uranyan/App/App/Info.plist || \
            plutil -insert NSPhotoLibraryUsageDescription -string "占い結果のシェア時に写真ライブラリにアクセスする場合があります。" ios-uranyan/App/App/Info.plist
          plutil -replace NSPhotoLibraryAddUsageDescription -string "占い結果のシェア画像を写真ライブラリに保存する際に使用します。" ios-uranyan/App/App/Info.plist || \
            plutil -insert NSPhotoLibraryAddUsageDescription -string "占い結果のシェア画像を写真ライブラリに保存する際に使用します。" ios-uranyan/App/App/Info.plist

      - name: Verify patches
        run: |
          echo "--- Info.plist ---"
          plutil -p ios-uranyan/App/App/Info.plist | head -30
          echo "--- pbxproj bundle id ---"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios-uranyan/App/App.xcodeproj/project.pbxproj | head -10

      - name: Run cap sync once to ensure plugins are wired
        run: |
          mv capacitor.config.ts capacitor.config.ts.bak
          cp capacitor.uranyan.config.ts capacitor.config.ts
          npx cap sync ios-uranyan || npx cap sync ios
          rm capacitor.config.ts
          mv capacitor.config.ts.bak capacitor.config.ts

      - name: Create branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BRANCH="chore/init-ios-uranyan-${RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add ios-uranyan

          # 多行のコミットメッセージは一旦ファイルに書き出して -F で渡す
          # (YAML の run: | ブロック内で頭ゼロインデントを使うと parse エラーになるため)
          cat > "${RUNNER_TEMP}/commit-msg.txt" <<EOF
          chore(uranyan): init ios-uranyan/ via CI

          Generated by .github/workflows/ios-uranyan-init.yml (run #${RUN_NUMBER}).

          - npx cap add ios + 同 ios/ -> ios-uranyan/ リネーム
          - CFBundleDisplayName を「うらにゃん」に
          - 未使用の usage description を削除

          Bundle ID は capacitor.uranyan.config.ts 由来で jp.filmo.uranyan。
          EOF
          # heredoc の各行先頭の 10 スペース (YAML インデント分) を削除
          sed -i '' -E 's/^          //' "${RUNNER_TEMP}/commit-msg.txt"

          git commit -F "${RUNNER_TEMP}/commit-msg.txt"
          git push origin "$BRANCH"

          cat > "${RUNNER_TEMP}/pr-body.md" <<'EOF'
          GitHub Actions の `ios-uranyan-init.yml` が自動生成した iOS プロジェクト。

          このマージ後、`ios-uranyan-build.yml` で TestFlight 配信可能になります。

          生成内容:
          - `ios-uranyan/App.xcworkspace` (Bundle ID: `jp.filmo.uranyan`, 表示名: `うらにゃん`)
          - Capacitor プラグイン同期済み

          レビューポイント:
          - `ios-uranyan/App/App/Info.plist` の CFBundleDisplayName が「うらにゃん」になっているか
          - 不要な usage description が消えているか
          EOF
          sed -i '' -E 's/^          //' "${RUNNER_TEMP}/pr-body.md"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(uranyan): init ios-uranyan/ via CI" \
            --body-file "${RUNNER_TEMP}/pr-body.md"
